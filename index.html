<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />

    <title>NIGHT ROAD</title>

    <style>
        html,
        body,
        #app {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            overflow: hidden;
            background: #05040A;
            position: fixed;
            inset: 0;
        }

        html {
            width: 100vw;
            height: 100vh;
        }

        body {
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            display: block;
        }

        /*
         * IMPORTANT:
         * Do not set canvas width/height here.
         * Phaser.Scale.ENVELOP owns the canvas display size.
         * Overriding it with width:100% / height:100% breaks
         * the Scale Manager's aspect-ratio and input calculations.
         */
        canvas {
            display: block;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
    </style>

</head>


<body>

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
